name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality (fmt / vet / test / race)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Show version
        run: make version

      - name: Run checks
        run: make check

      - name: Run race tests
        run: make race

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Build
        run: make build

  # Public-surface guard: reject private-document references, local environment
  # narration, verification trailers, local paths, secrets, and unexpected CJK
  # in new commit messages and tracked files. It scans only the new range, so
  # historical content does not make every push fail; the tracked-tree scan is
  # the backstop for anything already committed. This is the CI copy of the
  # check; the blocking local copy lives in the private workspace hooks.
  public-surface:
    name: Public surface
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Check public surface
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            before="${{ github.event.pull_request.base.sha }}"
            after="${{ github.event.pull_request.head.sha }}"
          else
            before="${{ github.event.before }}"
            after="${{ github.sha }}"
          fi
          if ! git cat-file -e "$before" 2>/dev/null; then
            if git cat-file -e "$after^" 2>/dev/null; then
              before="$after^"
            else
              before="$after"
            fi
          fi
          python3 .github/scripts/check_public_surface.py --range "$before..$after" --tree
