name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Quality (fmt / vet / test / race)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Show version
        run: make version

      - name: Run static checks
        run: make fmt-check vet notices-check

      - name: Run tests with race detector and coverage
        run: go test -race -cover ./...

      - name: Run static analysis
        run: make lint

      - name: Run govulncheck
        run: make vuln

      - name: Build
        run: make build

      - name: Release smoke
        run: make smoke

  # Public-surface guard: reject private-document references, local environment
  # narration, verification trailers, local paths, secrets, and unexpected CJK
  # in new commit messages and tracked files. It scans only the new range, so
  # historical content does not make every push fail; the tracked-tree scan is
  # the backstop for anything already committed. This is the CI copy of the
  # check; the blocking local copy lives in the private workspace hooks.
  public-surface:
    name: Public surface
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Check public surface
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            before="${{ github.event.pull_request.base.sha }}"
            after="${{ github.event.pull_request.head.sha }}"
          else
            before="${{ github.event.before }}"
            after="${{ github.sha }}"
          fi
          if ! git cat-file -e "$before" 2>/dev/null; then
            if git cat-file -e "$after^" 2>/dev/null; then
              before="$after^"
            else
              before="$after"
            fi
          fi
          python3 .github/scripts/check_public_surface.py --range "$before..$after" --tree
