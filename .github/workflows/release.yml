name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Default to read-only; jobs that need to write grant it explicitly.
permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Verify release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      commit: ${{ steps.meta.outputs.commit }}
      build_time: ${{ steps.meta.outputs.build_time }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          version="$(tr -d '\r' < VERSION)"
          echo "ref=$GITHUB_REF"
          echo "ref_name=$GITHUB_REF_NAME"
          echo "ref_type=$GITHUB_REF_TYPE"
          echo "sha=$GITHUB_SHA"
          echo "version=$version"
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::error::release workflow must be triggered by a tag push (got $GITHUB_REF_TYPE)"
            exit 1
          fi
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match VERSION v$version"
            exit 1
          fi
          if [ "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" != "tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME is not an annotated tag"
            exit 1
          fi
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "::error::tag $GITHUB_REF_NAME is not on main"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run checks
        run: make check

      - name: Run race tests
        run: make race

  release:
    name: Publish release
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract tag message
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          notes_file="$RUNNER_TEMP/release-notes.txt"
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > "$notes_file"
          echo "notes_file=$notes_file" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build release binaries
        run: make dist

      - name: Smoke test binary
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          output="$(./dist/windwatch-linux-amd64-v${VERSION} version)"
          test "$output" = "windwatch v${VERSION}"

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
          NOTES_FILE: ${{ steps.notes.outputs.notes_file }}
        run: |
          set -euo pipefail
          assets=(
            "dist/windwatch-linux-amd64-v${VERSION}"
            "dist/windwatch-linux-arm64-v${VERSION}"
            "dist/SHA256SUMS"
          )
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            draft="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)"
            test "$draft" = "true"
            gh release edit "$GITHUB_REF_NAME" \
              --title "windwatch $GITHUB_REF_NAME" \
              --notes-file "$NOTES_FILE" \
              --draft
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --title "windwatch $GITHUB_REF_NAME" \
              --draft \
              --verify-tag \
              --notes-file "$NOTES_FILE"
          fi

      - name: Verify release assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          rm -rf verify
          mkdir -p verify
          gh release download "$GITHUB_REF_NAME" --dir verify
          cd verify
          for asset in \
            "windwatch-linux-amd64-v${VERSION}" \
            "windwatch-linux-arm64-v${VERSION}" \
            "SHA256SUMS"; do
            test -f "$asset"
          done
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 3
          sha256sum -c --strict SHA256SUMS

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/fynhq/windwatch:latest
            ghcr.io/fynhq/windwatch:v${{ needs.check.outputs.version }}
          build-args: |
            VERSION=v${{ needs.check.outputs.version }}
            COMMIT=${{ needs.check.outputs.commit }}
            BUILD_TIME=${{ needs.check.outputs.build_time }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image tags
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          export NO_COLOR=1
          version_digest="$(docker buildx imagetools inspect "ghcr.io/fynhq/windwatch:v${VERSION}" | awk '/^Digest:/ {print $2; exit}')"
          latest_digest="$(docker buildx imagetools inspect "ghcr.io/fynhq/windwatch:latest" | awk '/^Digest:/ {print $2; exit}')"
          test -n "$version_digest"
          test -n "$latest_digest"
          test "$version_digest" = "$latest_digest"

      - name: Smoke test image on both architectures
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          image="ghcr.io/fynhq/windwatch:v${VERSION}"
          for platform in linux/amd64 linux/arm64; do
            output="$(docker run --rm --platform "$platform" "$image" version)"
            test "$output" = "windwatch v${VERSION}"
          done

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
