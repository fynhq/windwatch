# Public example template. Copy it to compose.yaml and adjust locally.
# 公开示例模板。复制为 compose.yaml 后按本地环境调整。
# compose.yaml is gitignored and intended for local deployment only.
# compose.yaml 已被 Git 忽略，仅用于本地部署。
# Set WINDWATCH_IMAGE to pin a version tag or digest, or use a locally built image.
# 设置 WINDWATCH_IMAGE 可固定版本标签或 digest，或使用本地构建的镜像。
# Upgrading from the old windwatch_data volume? Stop the stack and copy /data
# into ./data before the first start; see README "Data and backup".
# 从旧命名卷 windwatch_data 升级？首次启动前停机，把 /data 复制到 ./data；
# 详见 README“数据与备份”。
name: windwatch

services:
  windwatch:
    image: ${WINDWATCH_IMAGE:-ghcr.io/fynhq/windwatch:latest}
    container_name: windwatch
    restart: unless-stopped
    # Linux default: host networking lets WindWatch reach services bound to the
    # host's loopback address, such as a local proxy on 127.0.0.1.
    # Linux 默认：host 网络让 WindWatch 能访问绑定在宿主机回环地址的服务，
    # 例如 127.0.0.1 上的本地代理。
    network_mode: host
    # Docker Desktop (and other setups where host networking is unavailable or
    # undesirable): remove `network_mode: host` above and publish the port
    # instead. Use `host.docker.internal`, not 127.0.0.1, to reach the host.
    # Docker Desktop（以及其它不适合 host 网络的环境）：删除上面的
    # `network_mode: host`，改用端口映射；访问宿主机请用
    # `host.docker.internal` 而不是 127.0.0.1。
    # ports:
    #   - "8080:8080"
    environment:
      WINDWATCH_ADDR: ":8080"
      WINDWATCH_DATA_DIR: "/data"
      WINDWATCH_HEALTH_URL: "http://127.0.0.1:8080/healthz"
      GOMEMLIMIT: "96MiB"
      # Set this only when a trusted reverse proxy fronts the container.
      # 仅当容器前有可信反向代理时设置。
      # WINDWATCH_TRUSTED_PROXIES: "172.18.0.0/16"
    # Data and daily logs share one host directory next to this file. On Linux,
    # create it first and hand it to the container user:
    #   sudo install -d -o 65532 -g 65532 -m 0700 data
    # On Docker Desktop, create ./data with mkdir and verify the container can write it.
    # 数据与按天日志共用本文件旁的宿主目录。Linux 下先创建并交给容器用户：
    #   sudo install -d -o 65532 -g 65532 -m 0700 data
    # Docker Desktop 下先 mkdir，再验证容器可写。
    volumes:
      - ./data:/data
      # Docker container monitoring needs the socket and the host docker group.
      # Docker 容器监控需要访问 socket 和宿主机 docker 组。
      # Mounting the socket grants WindWatch significant control over the host.
      # 挂载 socket 会让 WindWatch 获得对宿主机的较高控制权限。
      # - /var/run/docker.sock:/var/run/docker.sock:ro
    # group_add:
    #   - "${DOCKER_GID:-999}"
    read_only: true
    tmpfs:
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
