<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="WindWatch icon">
  <defs>
    <linearGradient id="icBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#131c31"/>
    </linearGradient>
    <linearGradient id="icSky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <!-- circular backdrop -->
  <circle cx="512" cy="512" r="512" fill="url(#icBg)"/>

  <g transform="translate(512,512) scale(4)">
    <!-- monitoring ring -->
    <circle cx="0" cy="0" r="84" fill="none" stroke="url(#icSky)" stroke-width="8"/>

    <!-- three nested C-arcs opening right = ear whorls / listening -->
    <g fill="none" stroke="url(#icSky)" stroke-width="8" stroke-linecap="round">
      <path d="M 30 -52 A 60 60 0 1 0 30 52" opacity="0.5"/>
      <path d="M 23 -35 A 40 40 0 1 0 23 35" opacity="0.75"/>
      <path d="M 15 -18 A 22 22 0 1 0 15 18"/>
    </g>
  </g>
</svg>
